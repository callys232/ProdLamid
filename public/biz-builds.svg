<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#0d1a35" />
      <stop offset="100%" stop-color="#06080f" />
    </radialGradient>
    <radialGradient id="centerGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="goldGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0" />
    </radialGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feMerge><feMergeNode in="blur" /><feMergeNode in="SourceGraphic" /></feMerge>
    </filter>
    <filter id="softglow">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge><feMergeNode in="blur" /><feMergeNode in="SourceGraphic" /></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="400" height="300" fill="url(#bgGrad)" />

  <!-- Subtle grid -->
  <g opacity="0.04" stroke="#ffffff" stroke-width="0.6">
    <line x1="0" y1="75" x2="400" y2="75" />
    <line x1="0" y1="150" x2="400" y2="150" />
    <line x1="0" y1="225" x2="400" y2="225" />
    <line x1="100" y1="0" x2="100" y2="300" />
    <line x1="200" y1="0" x2="200" y2="300" />
    <line x1="300" y1="0" x2="300" y2="300" />
  </g>

  <!-- ── Bar chart / capacity growth (bottom-left) ── -->
  <g filter="url(#glow)">
    <rect x="28" y="220" width="14" height="48" rx="2" fill="#3b82f6" opacity="0.45" />
    <rect x="48" y="200" width="14" height="68" rx="2" fill="#3b82f6" opacity="0.55" />
    <rect x="68" y="176" width="14" height="92" rx="2" fill="#3b82f6" opacity="0.65" />
    <rect x="88" y="154" width="14" height="114" rx="2" fill="#60a5fa" opacity="0.7" />
    <!-- Baseline -->
    <line x1="22" y1="269" x2="108" y2="269" stroke="#3b82f6" stroke-width="1.5" opacity="0.5" />
    <!-- Upward arrow on last bar -->
    <polygon points="95,148 101,148 98,140" fill="#60a5fa" opacity="0.8" />
  </g>

  <!-- ── Network nodes / VC ecosystem (center) ── -->
  <ellipse cx="210" cy="140" rx="70" ry="52" fill="url(#centerGlow)" />

  <!-- Connection lines first (behind nodes) -->
  <g stroke-width="1" opacity="0.28">
    <line x1="210" y1="140" x2="148" y2="98" stroke="#3b82f6" />
    <line x1="210" y1="140" x2="282" y2="88" stroke="#f59e0b" />
    <line x1="210" y1="140" x2="160" y2="196" stroke="#10b981" />
    <line x1="210" y1="140" x2="290" y2="182" stroke="#3b82f6" />
    <line x1="148" y1="98" x2="282" y2="88" stroke="#60a5fa" opacity="0.15" />
    <line x1="282" y1="88" x2="290" y2="182" stroke="#f59e0b" opacity="0.15" />
    <line x1="160" y1="196" x2="290" y2="182" stroke="#10b981" opacity="0.15" />
  </g>

  <!-- Central node -->
  <circle cx="210" cy="140" r="14" fill="none" stroke="#3b82f6" stroke-width="2" opacity="0.9" filter="url(#glow)" />
  <circle cx="210" cy="140" r="7" fill="#3b82f6" opacity="0.7" />

  <!-- Satellite node — top-left (blue) -->
  <circle cx="148" cy="98" r="9" fill="none" stroke="#60a5fa" stroke-width="1.5" opacity="0.75" />
  <circle cx="148" cy="98" r="4.5" fill="#60a5fa" opacity="0.55" />

  <!-- Satellite node — top-right (gold) -->
  <circle cx="282" cy="88" r="11" fill="none" stroke="#f59e0b" stroke-width="1.5" opacity="0.8" filter="url(#glow)" />
  <circle cx="282" cy="88" r="5.5" fill="#f59e0b" opacity="0.6" />

  <!-- Satellite node — bottom-left (green) -->
  <circle cx="160" cy="196" r="8" fill="none" stroke="#10b981" stroke-width="1.5" opacity="0.7" />
  <circle cx="160" cy="196" r="4" fill="#10b981" opacity="0.5" />

  <!-- Satellite node — bottom-right (blue) -->
  <circle cx="290" cy="182" r="10" fill="none" stroke="#3b82f6" stroke-width="1.5" opacity="0.7" />
  <circle cx="290" cy="182" r="5" fill="#3b82f6" opacity="0.5" />

  <!-- ── Handshake / trust (bottom-center) ── -->
  <g transform="translate(148, 226)" opacity="0.78" filter="url(#glow)">
    <!-- Left arm -->
    <path d="M0,24 Q8,8 20,8 L36,8" fill="none" stroke="#10b981" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
    <!-- Right arm -->
    <path d="M104,24 Q96,8 84,8 L68,8" fill="none" stroke="#10b981" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
    <!-- Clasped hands (overlap zone) -->
    <path d="M36,8 Q52,0 52,8 Q52,16 68,8" fill="none" stroke="#10b981" stroke-width="2.5" stroke-linecap="round" />
    <!-- Knuckle details -->
    <circle cx="42" cy="7" r="2" fill="#10b981" opacity="0.5" />
    <circle cx="52" cy="5" r="2" fill="#10b981" opacity="0.5" />
    <circle cx="62" cy="7" r="2" fill="#10b981" opacity="0.5" />
    <!-- Cuff lines -->
    <line x1="16" y1="12" x2="16" y2="22" stroke="#10b981" stroke-width="1" opacity="0.4" />
    <line x1="88" y1="12" x2="88" y2="22" stroke="#10b981" stroke-width="1" opacity="0.4" />
  </g>

  <!-- ── Dollar symbols (top-right) ── -->
  <ellipse cx="330" cy="110" rx="32" ry="28" fill="url(#goldGlow)" />
  <text x="318" y="108" font-family="Georgia, 'Times New Roman', serif" font-size="26" font-weight="bold" fill="#f59e0b" opacity="0.75" filter="url(#glow)">$</text>
  <text x="338" y="90" font-family="Georgia, 'Times New Roman', serif" font-size="16" font-weight="bold" fill="#f59e0b" opacity="0.45">$</text>
  <text x="307" y="128" font-family="Georgia, 'Times New Roman', serif" font-size="14" font-weight="bold" fill="#fbbf24" opacity="0.35">$</text>

  <!-- ── Rising trend line (overlay on chart area) ── -->
  <polyline points="28,248 48,232 68,212 88,190 108,168" fill="none" stroke="#34d399" stroke-width="1.5" stroke-dasharray="4,3" opacity="0.5" />

  <!-- ── Label chips ── -->
  <g font-family="'Inter', 'Helvetica Neue', sans-serif" font-size="8" font-weight="600" letter-spacing="0.5">
    <rect x="170" y="128" width="80" height="16" rx="8" fill="#3b82f6" opacity="0.15" />
    <text x="210" y="139.5" text-anchor="middle" fill="#93c5fd" opacity="0.9">VC NETWORK</text>

    <rect x="118" y="242" width="64" height="14" rx="7" fill="#10b981" opacity="0.12" />
    <text x="150" y="251.5" text-anchor="middle" fill="#6ee7b7" opacity="0.8">TRUST</text>

    <rect x="24" y="136" width="56" height="14" rx="7" fill="#3b82f6" opacity="0.12" />
    <text x="52" y="145.5" text-anchor="middle" fill="#93c5fd" opacity="0.8">CAPACITY</text>

    <rect x="294" y="62" width="56" height="14" rx="7" fill="#f59e0b" opacity="0.12" />
    <text x="322" y="71.5" text-anchor="middle" fill="#fcd34d" opacity="0.8">CAPITAL</text>
  </g>

  <!-- Subtle vignette -->
  <radialGradient id="vignette" cx="50%" cy="50%" r="70%">
    <stop offset="60%" stop-color="transparent" />
    <stop offset="100%" stop-color="#000000" stop-opacity="0.45" />
  </radialGradient>
  <rect width="400" height="300" fill="url(#vignette)" />
</svg>
